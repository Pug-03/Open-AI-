# Walk We speech proxy. Set ELEVENLABS_API_KEY as a Worker secret to enable it.
name = "walkwe-ai-proxy-v2"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Exact origin of the deployed web app; anything else gets 403. For local
# development put ALLOWED_ORIGINS="http://localhost:5174" in .dev.vars (git-ignored).
ALLOWED_ORIGINS = "https://walkwe-web2.walkwe.workers.dev"

# 20 requests per minute per client address (all paths together)…
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# …and 120 per minute for the whole service, whoever is calling.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

# Keep request text out of Worker logs.
[observability]
enabled = false
